<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">📝 Task Manager</span>
    <button id="logout-btn" class="btn-secondary">Log Out</button>
  </nav>

  <div class="dashboard-container">
    <h1 id="greeting">Hello!</h1>

    <div class="progress-section">
      <div class="progress-label">
        <span id="progress-text">0 of 0 tasks completed</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <form id="task-form">
      <input type="text" id="task-title" placeholder="Add a new task..." required>
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
