apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: task-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      containers:
        - name: task-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}