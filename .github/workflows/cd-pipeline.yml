name: CD Pipeline - Deploy to AWS EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Debug - list repo contents
        run: |
          pwd
          ls -la
          ls -la helm-chart/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install task-manager ./helm-chart \
            --namespace task-manager \
            --create-namespace \
            --set image.tag=${{ github.event.inputs.image_tag }}

      - name: Verify rollout
        run: kubectl rollout status deployment/task-manager-deployment -n task-manager

      - name: Get service URL
        run: kubectl get service task-manager-service -n task-manager