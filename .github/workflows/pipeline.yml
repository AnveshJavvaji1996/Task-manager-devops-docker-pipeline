name: Task Manager CI/CD pipeline

on: push

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name:  Checkout repo code
            uses:  actions/checkout@v4
          
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: '20'
           
          - name: Install dependencies
            run:  npm install     

          - name: Run tests
            run:  npm test
         
    build-scan-push:
        needs: test
        runs-on: ubuntu-latest
        steps:
          - name:  Checkout repo code
            uses:  actions/checkout@v4   

          - name: Build Docker image
            run:  docker build -t anvesh3231/task-manager-app:${{ github.sha }} -t anvesh3231/task-manager-app:latest .
            
          - name: Scan image with Trivy
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: anvesh3231/task-manager-app:latest
              format: table
              severity: CRITICAL,HIGH
              exit-code: 0 
            
          - name:  Log in to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME}}
                password: ${{ secrets.DOCKERHUB_TOKEN}}    
           
          - name: Push image to Docker Hub
            run: |
                docker push anvesh3231/task-manager-app:${{ github.sha }}
                docker push anvesh3231/task-manager-app:latest